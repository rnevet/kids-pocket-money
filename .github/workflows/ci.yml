name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ci
          VITE_GOOGLE_API_KEY: ci
          VITE_GOOGLE_APP_ID: ci
